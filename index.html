<!DOCTYPE html>
<html>
<head>
<title>Piticos Pet</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css">
</head>


<body>
    <header>
        <nav>
            <div class="logos">
                <img src="imagens/LogoPitico.png" alt="Logo Pitico Pet">
                <a class="logo"><font color="#eaa034">&nbspP</font> i t i c o &nbsp P e t</a>
            </div> 
            <div class="mobile-menu">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
            <ul class="nav-list">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <div class="produtos">
            <div class="produtos-imagens">
                <img class = "produto" src="imagens/carrossel/imagem1.png" alt="Promoção">
                <img class = "produto" src="imagens/carrossel/imagem2.png" alt="Ecológico">
                <img class = "produto" src="imagens/carrossel/imagem3.png" alt="Estilo">
                <img class = "produto" src="imagens/carrossel/imagem4.png" alt="Conforto">
                <img class = "produto" src="imagens/carrossel/imagem5.png" alt="Higiene">
                <img class = "produto" src="imagens/carrossel/imagem6.png" alt="Segurança">
            </div>
            <button class="prev"> &larr;</button>
            <button class="prox"> &rarr;</button>
    </main>
    <script src="mobile-navbar.js"></script>
</body>

<script>
const prevButton = document.querySelector('.prev');
const nextButton = document.querySelector('.prox');
const carouselImages = document.querySelector('.produtos-imagens');
const images = document.querySelectorAll('.produto');
const totalImages = images.length;

let currentIndex = 0;
let isTransitioning = false;
let imageWidth = document.querySelector('.produto').clientWidth;

const firstImageClone = images[0].cloneNode(true);
const lastImageClone = images[totalImages - 1].cloneNode(true);

carouselImages.appendChild(firstImageClone); 
carouselImages.insertBefore(lastImageClone, images[0]); 


window.addEventListener('resize', () => {
    imageWidth = document.querySelector('.produto').clientWidth;
    carouselImages.style.transition = 'none';
    carouselImages.style.transform = `translateX(-${(currentIndex + 1) * imageWidth}px)`;
});


function updateCarousel() {
    if (isTransitioning) return;
    isTransitioning = true;
    
    carouselImages.style.transition = 'transform 0.5s ease-in-out';
    carouselImages.style.transform = `translateX(-${(currentIndex + 0) * imageWidth}px)`;
    
    carouselImages.addEventListener('transitionend', () => {
        isTransitioning = false;


        if (currentIndex === totalImages) {
            currentIndex = 0;
            carouselImages.style.transition = 'none'; // Remove a transição para evitar o salto
            carouselImages.style.transform = `translateX(-${(currentIndex + 0) * imageWidth}px)`;
        }
        
        if (currentIndex === -1) {
            currentIndex = totalImages;
            carouselImages.style.transition = 'none'; // Remove a transição para evitar o salto
            carouselImages.style.transform = `translateX(-${(currentIndex + 2) * imageWidth}px)`;
        }
    }, { once: true });
}


nextButton.addEventListener('click', () => {
    if (isTransitioning) return;
    currentIndex++;
    
    if (currentIndex > totalImages) { 
        currentIndex = totalImages;
    }
    
    updateCarousel();
});


prevButton.addEventListener('click', () => {
    if (isTransitioning) return;
    currentIndex--;
    
    if (currentIndex < -1) { 
        currentIndex = -1;
    }
    
    updateCarousel();
});

</script>


</html>
